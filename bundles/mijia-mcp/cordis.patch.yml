# 米家 MCP 接入：mijia-api stdio 服务器 + 设备白名单执行层守卫
- insert:
    - id: mijia-api
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: mijia
        transport: stdio
        command: /Users/zhonglifeng/miniconda3/bin/mijiaAPI
        args:
          - mcp
          - -p
          - /Users/zhonglifeng/.config/mijia-api/auth.json
        toolCallTimeoutMs: 90000
        failOnStartupError: true
    - id: mijia-device-guard
      name: '@local/mijia-mcp'
      config:
        serverName: mijia
        devices:
          - alias: ceilingLight
            label: 吸顶灯（Yeelight 纤玉 C2001）
            did: "360350916"
            names:
              - 吸顶灯
          - alias: airPurifier
            label: 米家空气净化器 5S
            did: "832685933"
            names:
              - Mijia Smart Air Purifier 5S
          - alias: fan1x
            label: 米家直流变频落地扇 1X
            did: "742929654"
            names:
              - Mijia Smart DC Standing Fan 1X
          - alias: airer
            label: MrBond 智能晾衣架
            did: "648002374"
            names:
              - MrBond smart clothes dryer-Simple3
