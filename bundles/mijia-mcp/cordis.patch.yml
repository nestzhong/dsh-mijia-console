# 米家 MCP 接入：mijia-api stdio 服务器 + 三台设备白名单执行层守卫
- insert:
    - id: mijia-api
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: mijia
        transport: stdio
        command: /Users/xuanyumacbook/.local/share/mijia-api/venv/bin/mijiaAPI
        args:
          - mcp
          - -p
          - /Users/xuanyumacbook/.config/mijia-api/auth.json
        toolCallTimeoutMs: 90000
        failOnStartupError: true
    - id: mijia-device-guard
      name: '@local/mijia-mcp'
      config:
        serverName: mijia
        devices:
          - alias: plug4
            label: 灯带（小米智能插座 4）
            did: "2246644058"
            names:
              - 灯带
          - alias: lightbar2
            label: 米家显示器挂灯 2
            did: "2110659496"
            names:
              - 米家显示器挂灯2
          - alias: acpartner2
            label: 米家空调伴侣 2
            did: "2059271104"
            names:
              - 空调插座
