# 米家控制台页面：Host 端（状态聚合 + 受控控制 + 操作日志），Client 端为主面板页面
# 注意：YAML 1.1 中 on/off 会被解析为布尔值，属性键 "on" 与属性名 "on" 都必须加引号。
- insert:
    - id: mijia-console
      name: '@local/mijia-console'
      config:
        serverName: mijia
        devices:
          - alias: ceilingLight
            did: "360350916"
            kind: light
            icon: lightbar.png
            label: { zh: 吸顶灯, en: Ceiling Light }
            product: { zh: Yeelight 纤玉 C2001, en: Yeelight C2001 }
            props: { "on": "on", brightness: brightness, colorTemperature: color-temperature, mode: mode }
            writable:
              "on": { prop: "on", type: bool }
              brightness: { prop: brightness, type: int, min: 1, max: 100 }
              colorTemperature: { prop: color-temperature, type: int, min: 2700, max: 6500 }
